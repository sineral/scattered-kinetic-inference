      - 1.0
    constraints: {}
  M6:
    initial_ranges:
      S:
      - 0.4
      - 1.2
      cat:
      - 0.01
      - 0.1
      cat*:
      - 0.0
      - 0.0
      cat*S:
      - 0.0
      - 0.0
      P:
      - 0.0
      - 1.0
    constraints:
      screening:
        description: Standard S/P; test with cat0 in [0.03, 0.07] at X=0.20. Pass if active-cat fraction
          (cat*+cat*S) is between 10% and 90%.
        initial_override:
          S: 1.0
          P: 0.0
          cat*: 0.0
          cat*S: 0.0
        cat0_scan:
          type: grid
          low: 0.03
          high: 0.07
          n: 5
          existential: true
        at_conv:
          X:
          - 0.2
          - 0.2
          rules:
          - expr: (cat* + cat*S) / (cat + cat* + cat*S) >= 0.10
          - expr: (cat* + cat*S) / (cat + cat* + cat*S) <= 0.90
