# Rate-constant sampling and mechanism-specific screening rules.
# ODE species/reactions live in mechanisms.yaml; this file is only used by
# data_generation/screen_k.py and data_generation/generate_scattered_dataset.py.
#
# Screening expressions are evaluated on species concentrations at a given
# conversion window. Names with '*' are mapped to '_star' before eval
# (e.g. cat* -> cat_star).
global_k_sampler:
  distribution: loguniform
  low: 1.0e-5
  high: 1.0e5
  round_sigfigs: 3
mechanisms:
  M1:
    initial_ranges:
      S:
      - 0.4
      - 1.2
      cat:
      - 0.01
      - 0.1
      catS:
      - 0.0
      - 0.0
      P:
      - 0.0
      - 1.0
    constraints: {}
  M2:
    initial_ranges:
      S:
      - 0.4
      - 1.2
      cat:
      - 0.01
      - 0.1
      catS:
      - 0.0
      - 0.0
      cat2:
      - 0.0
      - 0.0
      P:
      - 0.0
      - 1.0
    constraints:
      screening:
        description: Test at standard S/P with cat0=0.05; pass if in X∈[0.20,0.50] dimer share ≥10%.
        initial_override:
          S: 1.0
          P: 0.0
          catS: 0.0
          cat2: 0.0
        cat0_scan:
          type: grid
          low: 0.05
          high: 0.05
          n: 1
          existential: true
        at_conv:
          X:
          - 0.2
          - 0.5
          rules:
          - expr: (2*cat2) / (cat + catS + 2*cat2) >= 0.10
  M3:
    initial_ranges:
      S:
      - 0.4
      - 1.2
      cat:
      - 0.01
      - 0.1
      cat2:
      - 0.0
      - 0.0
      cat2S:
      - 0.0
      - 0.0
      P:
      - 0.0
      - 1.0
    constraints:
      screening:
        description: Standard S/P; test with cat0=0.05 at early conversion (X≤0.10). Pass if free-cat
          fraction ≥5%.
        initial_override:
          S: 1.0
          P: 0.0
          cat2: 0.0
          cat2S: 0.0
        cat0_scan:
          type: grid
          low: 0.05
          high: 0.05
          n: 1
          existential: true
        at_conv:
          X:
          - 0.0
          - 0.1
          rules:
          - expr: cat / (cat + 2*cat2 + 2*cat2S) >= 0.05
  M4:
    initial_ranges:
      S:
      - 0.4
      - 1.2
      X:
      - 0.0
      - 0.0
      cat:
      - 0.01
      - 0.1
      catS:
      - 0.0
      - 0.0
      P:
      - 0.0
      - 1.0
    constraints: {}
  M5:
    initial_ranges:
      S:
      - 0.4
